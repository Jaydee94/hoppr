name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the planned version and release notes only — do not build, tag, or publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Kept identical in both semantic-release runs so the dry run in `plan`
  # resolves exactly the same plugin set as the real run in `publish`.
  SEMANTIC_RELEASE_PLUGINS: |
    @semantic-release/exec@7.1.0
    @semantic-release/changelog@7.0.0
    @semantic-release/git@11.0.1
    conventional-changelog-conventionalcommits@9.3.1

jobs:
  # ── semantic-release dry run: derive the next version from the
  #    Conventional Commits since the last v* tag (see .releaserc). Single
  #    source of truth for every downstream job. ───────────────────────────
  plan:
    name: plan release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      previous_tag: ${{ steps.semrel.outputs.last_release_git_tag }}
    steps:
      - name: guard against non-main branches
        if: github.ref != 'refs/heads/main'
        env:
          TRIGGER_REF: ${{ github.ref }}
        run: |
          echo "::error ::Release must run against main, got ${TRIGGER_REF}."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: semrel
        name: semantic-release (dry run)
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          dry_run: true
          extra_plugins: ${{ env.SEMANTIC_RELEASE_PLUGINS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: summary
        env:
          PUBLISHED: ${{ steps.semrel.outputs.new_release_published }}
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
          PREVIOUS: ${{ steps.semrel.outputs.last_release_git_tag }}
          NOTES: ${{ steps.semrel.outputs.new_release_notes }}
        run: |
          if [ "$PUBLISHED" != "true" ]; then
            echo "::notice ::No release-worthy commits since ${PREVIOUS:-the beginning}; nothing to release."
            exit 0
          fi
          echo "::notice ::Planning release v${VERSION} (previous: ${PREVIOUS:-none})."
          {
            echo "## Planned release v${VERSION}"
            echo
            echo "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Cross-platform build matrix. Pins Cargo.toml to the planned version
  #    locally so binaries report the right --version even before the bump
  #    commit lands on main. ────────────────────────────────────────────────
  build:
    name: build ${{ matrix.target }}
    needs: plan
    if: ${{ needs.plan.outputs.published == 'true' && inputs.dry_run != true }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: hoppr-linux-x86_64.tar.gz
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset: hoppr-linux-aarch64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-14
            asset: hoppr-macos-x86_64.tar.gz
            cross: false
            macos_target: "10.14"
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: hoppr-macos-aarch64.tar.gz
            cross: false
            macos_target: "11.0"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: hoppr-windows-x86_64.zip
            cross: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: pin version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          # Keep Cargo.lock consistent so --locked succeeds in the build step.
          cargo update -p hoppr
      - name: install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: build
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="hoppr"
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          STAGE="hoppr-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${BIN}${EXT}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z a "dist/${{ matrix.asset }}" "$STAGE"
          else
            tar -czf "dist/${{ matrix.asset }}" "$STAGE"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  # ── semantic-release for real: bump Cargo.toml + Cargo.lock, prepend
  #    CHANGELOG.md, commit, tag, push, and create the GitHub Release with
  #    every binary + checksums attached. ──────────────────────────────────
  publish:
    name: publish release
    needs: [plan, build]
    if: ${{ needs.plan.outputs.published == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum hoppr-* > checksums.txt
          cat checksums.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: semantic-release
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          extra_plugins: ${{ env.SEMANTIC_RELEASE_PLUGINS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # Read by verifyReleaseCmd in .releaserc: refuse to publish if a
          # commit landed on main after `plan` and changed the version.
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
